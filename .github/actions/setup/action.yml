name: Setup workspace
description: Node (with the npm cache), optionally Bun, and the workspace install.

inputs:
  bun:
    description: Also install Bun.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # node:sqlite (used when the server runs under Node) needs >= 22.13
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Setup Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: make install
