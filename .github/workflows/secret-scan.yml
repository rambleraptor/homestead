name: Secret Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    name: Gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so pushes scan every new commit in the range, not just
          # the tip. On pull_request the action scans the PR's commit range.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-root .gitleaks.toml drives the rules + allowlist.
          GITLEAKS_CONFIG: .gitleaks.toml
