name: CI Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run still going on its previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent jobs, so the wall-clock time is the slowest one rather than the
# sum. Each suite runs exactly once per runtime.
jobs:
  static:
    runs-on: ubuntu-latest
    name: Type check, lint, build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # The tsc projects are independent; run them side by side.
      - name: Run TypeScript type check
        run: make -j --output-sync=target type-check

      - name: Run ESLint
        run: make lint

      - name: Build application
        run: make build

  unit:
    runs-on: ubuntu-latest
    name: Unit tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run frontend unit tests
        run: make test-unit VITEST_ARGS=--shard=${{ matrix.shard }}/2

  # The CLI + server suites run under both supported runtimes.
  server:
    runs-on: ubuntu-latest
    name: Server + CLI tests (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          bun: ${{ matrix.runtime == 'bun' }}

      - name: Run server + CLI tests
        run: make ${{ matrix.runtime == 'bun' && 'test-cli' || 'test-node' }}

  # The VM tier: the real SPA in happy-dom against the in-process server.
  vm-tests:
    runs-on: ubuntu-latest
    name: VM Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Warm-start caches, restored after install so npm leaves them alone.
      # All three validate their own contents (the template db is keyed on the
      # sources it was built from, Vitest's caches on file contents), so the
      # newest entry is always safe to restore.
      - name: Restore VM test caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/homestead-vm
            node_modules/.experimental-vitest-cache
            node_modules/.vite
          key: vm-tests-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vm-tests-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            vm-tests-${{ runner.os }}-

      - name: Run VM-tier tests
        run: make test-vm

  # Only the flows that need a real browser (offline, canvas, request
  # interception) stay on Playwright; see CLAUDE.md.
  e2e:
    runs-on: ubuntu-latest
    name: E2E (Playwright)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # globalSetup boots homestead-server under Bun.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          bun: 'true'

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  # One stable check that is green only when every job above is, so branch
  # protection can require a single name.
  ci-checks:
    runs-on: ubuntu-latest
    name: CI Checks
    if: always()
    needs: [static, unit, server, vm-tests, e2e]

    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "❌ Some CI jobs did not pass" >&2
            exit 1
          fi
          echo "✅ All CI checks passed!"
          echo "📌 Commit: ${{ github.sha }}"
          echo "🔀 Branch: ${{ github.ref_name }}"
